<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, DejaVu Sans, sans-serif">
<title id="t">Share of new metro lines in mainland China that are automated (&gt; GoA2), by year</title>
<desc id="d">1987/8434 new grade-separated, non-mainline urban rail lines opened in 2016 to 2026-10-29 are automated.</desc>
