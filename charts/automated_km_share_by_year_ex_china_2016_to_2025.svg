<g><title>2025: 138/205 new km automated (67%)</title>
<rect x="675.2" y="72" width="68.8" height="284" fill="transparent"/>
<path class="bar" d="M685.5,356.0 V168.4 Q685.5,164.4 689.5,164.4 H729.7 Q733.7,164.4 733.7,168.4 V356.0 Z"/>
