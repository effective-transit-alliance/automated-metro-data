<text class="t2" x="56" y="412" font-size="11">Below each year: automated/new km. New lines and extensions; 100 openings of unknown length left out.</text>
<text class="t2" x="56" y="426" font-size="11">Sources: UrbanRail.net, CAMET.</text>
