name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: uv lock
        run: uv lock --check

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: ty
        run: uv run ty check

      - name: pyrefly
        run: uv run pyrefly check

      - name: shellcheck
        run: uv run shellcheck scripts/*.sh

      - name: actionlint
        run: uv run actionlint

      # The CAMET reports are about 30 MB and their servers are slow,
      # so only download them when the cache doesn't have this set of them.
      - uses: actions/cache@v6.1.0
        with:
          path: data/raw/camet
          key: camet-${{ hashFiles('data/camet_sha256sums.txt') }}

      # The reports are pinned by hash, with archived copies to fall back on,
      # so this doesn't depend on CAMET's servers being up.
      - name: download the CAMET reports
        run: ./scripts/download_camet.sh

      # Rebuild everything from the committed sources and curation files,
      # and fail if any output differs from what's committed.
      # This uses the committed UrbanRail.net pages and Wikipedia list, not fresh ones,
      # since new openings there need reviewing in `data/curation/events.csv` first.
      - name: rebuild
        run: |
          uv run python scripts/parse_urbanrail.py data/urbanrail_events.csv data/raw/urbanrail/*.htm
          uv run python scripts/parse_camet.py data/camet_new_lines.csv data/raw/camet/camet-*.pdf
          uv run python scripts/extract_camet_text.py
          uv run python scripts/parse_wikipedia.py data/wikipedia_driverless.csv data/raw/wikipedia/list_of_driverless_train_systems.html
          uv run python scripts/build_openings.py
          uv run python scripts/plot_share.py

      - name: check the rebuild matches what's committed
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git status --porcelain)"

      # Fetch UrbanRail.net's pages at most once a day,
      # falling back to the last day's copy if the site is down.
      - name: get today's date
        id: today
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        id: urbanrail
        with:
          path: .cache/urbanrail
          key: urbanrail-${{ steps.today.outputs.date }}
          restore-keys: urbanrail-

      - name: download the UrbanRail.net pages
        if: steps.urbanrail.outputs.cache-hit != 'true'
        run: |
          ./scripts/download_urbanrail.sh .cache/urbanrail \
            || echo "::warning::couldn't download UrbanRail.net's pages; using the cached copy"

      # Upstream changes don't fail CI, since they aren't caused by the change being tested,
      # but they're flagged so they can be downloaded and reviewed.
      # Parsing onto a copy of the committed events matches them up,
      # so entries UrbanRail.net only rewrote aren't flagged.
      - name: check for new or removed UrbanRail.net events
        run: |
          if [[ ! -s .cache/urbanrail/downloaded.txt ]]; then
            echo "::warning::no UrbanRail.net pages to compare against"
            exit
          fi
          cp data/urbanrail_events.csv .cache/urbanrail_events.csv
          uv run python scripts/parse_urbanrail.py .cache/urbanrail_events.csv .cache/urbanrail/*.htm \
            2> .cache/urbanrail_changes.txt
          cat .cache/urbanrail_changes.txt
          if changed=$(grep -c -E '^(new|gone): ' .cache/urbanrail_changes.txt); then
            echo "::warning::UrbanRail.net has $changed new or removed events; rerun \`download_urbanrail.sh\` and review them"
          fi
